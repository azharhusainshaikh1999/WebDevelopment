<div class="container mt-4">
  <div class="card shadow p-4">
    <div class="head row col-md-12">
      <h3 class="col-md-10">Add Sub-Contractor</h3>
      <button type="button" class="col-md-2 btn btn-info mb-3" routerLink="get-sub-contractor-list">
        Get Sub-Contractor List
      </button>
    </div>

    <form [formGroup]="subContractForm" (ngSubmit)="submitForm()">

      <div class="row">

        <div class="col-md-6 mb-3">
          <label class="form-label">Company Name</label>
          <input type="text" class="form-control" formControlName="companyName">
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">Specialization</label>
          <input type="text" class="form-control" formControlName="specialization">
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">Contact Person</label>
          <input type="text" class="form-control" formControlName="contactPerson">
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">Contact Number</label>
          <input type="text" class="form-control" formControlName="contactNumber">
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" formControlName="email">
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">GST Number</label>
          <input type="number" class="form-control" formControlName="gstNo">
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">Company Size</label>
          <input type="text" class="form-control" formControlName="companySize">
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">State</label>
          <input type="text" class="form-control" formControlName="state">
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">City</label>
          <input type="text" class="form-control" formControlName="city">
        </div>

        <div class="col-md-12 mb-3">
          <label class="form-label">Collaboration Terms</label>
          <textarea class="form-control" formControlName="collaborationTerms"></textarea>
        </div>

        <div class="col-md-12 mb-3">
          <label class="form-label">Remarks</label>
          <textarea class="form-control" formControlName="remarks"></textarea>
        </div>

      </div>

      <button class="btn btn-primary w-100 mt-3" type="submit">Submit</button>
    </form>
  </div>
</div>
