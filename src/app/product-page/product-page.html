<h2>Product table</h2>
<app-grid-layout [columns]="myColumns" [data]="myData" (edit)="onEdit($event)" (delete)="onDelete($event)"></app-grid-layout>
<app-dialog-box 
    [visible]="showDialog" 
    [title]="dialogTitle" 
    [message]="dialogMessage"
    (closed)="handleDialogResult($event)">
</app-dialog-box>

<button (click)="showDialog = true">Open Dialog</button>
