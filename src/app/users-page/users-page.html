<h2>Users table</h2>
<app-grid-layout [columns]="myColumns" [data]="myData"></app-grid-layout>

<app-dialog-box 
  [visible]="showDialog" 
  [title]="'Confirm Action'" 
  [message]="'Are you sure you want to proceed?'" 
  (closed)="handleDialogResult($event)">
</app-dialog-box>

<button (click)="showDialog = true">Open Dialog</button>
