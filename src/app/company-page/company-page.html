<div class="container">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">

        <app-input-fields formControlName="firstName" label="First Name"
            placeholder="Enter your first name"></app-input-fields>
        <div *ngIf="firstName?.invalid && (firstName?.dirty || firstName?.touched)" class="text-danger">
            <div *ngIf="firstName?.errors?.['required']">First Name is required.</div>
            <div *ngIf="firstName?.errors?.['minlength']">Minimum length is 2.</div>
        </div>

        <app-input-fields formControlName="lastName" label="Last Name"
            placeholder="Enter your last name"></app-input-fields>
        <div *ngIf="lastName?.invalid && (lastName?.dirty || lastName?.touched)" class="text-danger">
            <div *ngIf="lastName?.errors?.['required']">Last Name is required.</div>
            <div *ngIf="lastName?.errors?.['minlength']">Minimum length is 2.</div>
        </div>

        <app-input-fields formControlName="email" type="email" label="Email"
            placeholder="Enter your email"></app-input-fields>
        <div *ngIf="email?.invalid && (email?.dirty || email?.touched)" class="text-danger">
            <div *ngIf="email?.errors?.['required']">Email is required.</div>
            <div *ngIf="email?.errors?.['email']">Invalid email format.</div>
        </div>

        <app-input-fields formControlName="password" type="password" label="Password"
            placeholder="Enter your password"></app-input-fields>
        <div *ngIf="password?.invalid && (password?.dirty || password?.touched)" class="text-danger">
            <div *ngIf="password?.errors?.['required']">Password is required.</div>
            <div *ngIf="password?.errors?.['minlength']">Minimum length is 6.</div>
        </div>


        <button type="submit" [disabled]="form.invalid" class="btn btn-primary mt-2">Submit</button>
    </form>

</div>
